    <script>
      // Cleanly suppress Vite dev HMR WebSocket close errors in sandboxed iframe environment
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (
          (e.reason.message && e.reason.message.includes('WebSocket')) ||
          String(e.reason).includes('WebSocket')
        )) {
          e.preventDefault();
        }
      });
    </script>
